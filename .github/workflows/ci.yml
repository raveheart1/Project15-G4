name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Lint (flake8)
        run: flake8 elephantcallscounter

      - name: Unit tests (pytest)
        run: pytest
